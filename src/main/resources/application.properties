# Server
server.port=8080

# Active profile: 'h2' for local/debug, 'postgres' for production
# Override with: java -jar file-scanner.jar --spring.profiles.active=postgres
spring.profiles.active=h2

# Thymeleaf
spring.thymeleaf.cache=false

# JPA common settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# App config (defaults; overridden via Settings UI stored in DB)
app.scan.status-refresh-seconds=10
